# Builds this repository's image for amd64 and arm64 and pushes it to
# ghcr.io/lucya-astralis/<IMAGE>. Tags, as lucya-aio pulls them:
#   main        -> :stable
#   beta/*      -> :beta
#   v1.2.3 tag  -> :1.2.3 and :1.2
#   every build -> :sha-<short>
name: image

on:
  push:
    branches: [main, "beta/**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: aperture

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=stable,enable={{is_default_branch}}
            type=raw,value=beta,enable=${{ startsWith(github.ref, 'refs/heads/beta/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
