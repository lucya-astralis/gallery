# lucya.systems aperture — one image, one container, two ports.
#
#   docker compose up -d --build     ->  gallery  http://localhost:8000
#                                        console  http://127.0.0.1:8090
#
# The console's port is published to a HOST ADDRESS, not to every interface:
# `CONSOLE_HOST=127.0.0.1` keeps it on the machine, and a LAN or VPN address
# (`CONSOLE_HOST=10.0.0.5`) puts it on exactly that network and nowhere else.
# That is the boundary — the container itself always listens on 0.0.0.0:8090,
# because a container's own loopback would be unreachable from anywhere.
#
# To split the two apart instead, run this file twice with APERTURE_ROLE=public
# (photos mounted :ro) and APERTURE_ROLE=console.

services:
  aperture:
    build: .
    container_name: aperture
    ports:
      - "${PORT:-8000}:8000"
      - "${CONSOLE_HOST:-127.0.0.1}:${CONSOLE_PORT:-8090}:8090"
    volumes:
      # Read-write: editing the cfg files in .album/ and .gallery/ is what the
      # console is for. No route can address a photograph for writing.
      - ${PHOTOS_PATH:-./photos}:/photos
      - ${THUMBS_PATH:-./thumbnails}:/thumbnails
      - ${PREVIEWS_PATH:-./previews}:/previews
      - ${DATA_PATH:-./data}:/data
    environment:
      - APERTURE_ROLE=${APERTURE_ROLE:-all}
      - PHOTOS_DIR=/photos
      - THUMBS_DIR=/thumbnails
      - PREVIEWS_DIR=/previews
      - DATA_DIR=/data
      - THUMB_SIZE=${THUMB_SIZE:-480}
      - PREVIEW_SIZE=${PREVIEW_SIZE:-1600}
      # Default 300s: SMB/CIFS/NFS shares don't deliver file-watch events, so a
      # periodic full scan is what picks up newly added albums there.
      - SCAN_INTERVAL=${SCAN_INTERVAL:-300}
      - ENABLE_WATCHER=${ENABLE_WATCHER:-1}
      - HIDE_GPS=${HIDE_GPS:-1}
      - STRIP_GPS=${STRIP_GPS:-1}
      # Vision: search photos by what is in them ("sunset over the sea").
      # Off by default. On, the next scan downloads a ~217 MB local model into
      # DATA_DIR/models once and reads every photo (~40 ms each); nothing ever
      # leaves the machine. Set it for the console too, so System > Vision
      # reports it. See aperture/vision.py.
      - VISION=${VISION:-0}
      - VISION_THREADS=${VISION_THREADS:-2}
      # Public base URL used for OG / Twitter link previews. Set this when
      # behind a reverse proxy that terminates TLS.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # The reverse proxy's address (or network, comma-separated). Only it is
      # believed about the real client IP — which the console's login throttle
      # and audit log depend on. Leave the default when nothing sits in front.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # ----- console -----
      - CONSOLE_ENABLED=${CONSOLE_ENABLED:-1}
      # Always 0.0.0.0 INSIDE the container — a container's own loopback is
      # reachable from nowhere. The boundary is the host address in `ports`
      # above. Because this bind is not loopback, Aperture refuses to start
      # the console without a password unless CONSOLE_ALLOW_OPEN says the
      # boundary is handled here:
      #   docker compose run --rm aperture python -m aperture.cli passwd
      - CONSOLE_BIND=0.0.0.0
      - CONSOLE_ALLOW_OPEN=${CONSOLE_ALLOW_OPEN:-0}
      - READ_ONLY=${READ_ONLY:-0}
      # The console asks lucya.sh at most twice a day whether a newer aperture
      # exists and says so. Nothing is downloaded. 0 = never ask.
      - UPDATE_CHECK=${UPDATE_CHECK:-1}
      - BACKUPS=${BACKUPS:-20}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-8}
    # Nothing in here needs a privilege it isn't given. The user owns the four
    # mounts, so on a host it must match their owner: an upgrade from a
    # pre-1.0 container (which ran as root) needs a one-time
    #   sudo chown -R 10001:10001 data thumbnails previews
    # and a CIFS share must be mounted with uid=/gid= set to the same numbers,
    # or the console cannot write its cfg files. See DEPLOY-LINUX.md.
    user: "${APERTURE_UID:-10001}:${APERTURE_GID:-10001}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
